<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/logo.png" type="image/png">
    <title>Pesquisa SenaiTec</title>
</head>
<body>
    <main>
        <header>
            <img src="./img/logo.png" alt="Logo do senaitec"
            width="200px" height="200px">
            <h1>Pesquisa SenaiTec</h1>
        </header>
        <section>
            <form action="index.html" method="get">
                
                <fieldset>

                    <legend>Dados Pessoais</legend>
                    <label for="">Nome:</label>
                    <input type="text" name="username" id="username" required>
                    <br>
                    <label for="userage">Idade</label>
                    <input type="number" name="userage" id="userage" required min="12" max="100">
                    
                    
                    <br>
                    <label for="userbirthdate">Data de nascimento</label>
                    <input type="date" name="userbirthdate" id="userbirthdate">
                    
                    <br>
                    <label for="useremail">Email</label>
                    <input type="email" name="usermemail" id="usermemail" required>
                    
                    <br>
                    <label for="userphone">Telefone</label>
                    <input type="tel" name="userphone" id="userphone" pattern="[0-9] {11}" placeholder="21987654321">
                    
                    <br>
                    <label for="userimage">Upload da foto</label>
                    <input type="file" name="userimage" id="userimage">
                    
                </fieldset>

                <fieldset>
                <legend>Perfil</legend>    

                    <p>Gênero</p>
                
                    <!-- perguntando sobre genero -->
                <input type="radio" name="usergender" id="usergender1" value="Masculino">
                <label for="usergender">Masculino</label>
                <br>

                <input type="radio" name="usergender" id="usergender2" value="Feminino">
                <label for="usergender">Feminino</label>
                <br>

                <input type="radio" name="usergender" id="usergender3" value="Prefiro não informar">
                <label for="usergender">Prefiro não informar</label>
                <br>
                
                <label for="usermaritalstatus">Estado Civil</label>
                <select name="usermaritalstatus" id="usermaritalstatus">

                    <option value="">Selecione...</option>
                    <option value="solteiro">Solteiro(a)</option>   
                    <option value="casado">Casado(a)</option>
                    <option value="divorciado">Divorciado(a)</option>
                   <option value="viuvo">Viúvo</option>
                   <option value="uniaoestavel">União Estável</option>

                </select> 
                <br>
                <!-- pergunta sobre uf -->
                <label for="userstate">UF</label>
                <select name="userstate" id="userstate">

                  <option value="">Selecione...</option>
                   <option value="AC">Acre</option>
                   <option value="AL">Alagoas</option>
                   <option value="AP">Amapá</option>
                   <option value="AM">Amazonas</option>
                   <option value="BA">Bahia</option>
                   <option value="CE">Ceará</option>
                   <option value="DF">Distrito Federal</option>
                   <option value="ES">Espirito Santo</option>
                   <option value="GO">Goiás</option>
                   <option value="MA">Maranhão</option>
                   <option value="MT">Mato Grosso</option>
                   <option value="MS">Mato Grosso do Sul</option>
                   <option value="MG">Minas Gerais</option>
                   <option value="PA">Pará</option>
                   <option value="PB">Paraíba</option>
                   <option value="PR">Paraná</option>
                   <option value="PE">Pernambuco</option>
                   <option value="PI">Piauí</option>
                   <option value="RJ">Rio de Janeiro</option>
                   <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondonia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
                <br>
                <!-- cidade -->
                <label for="usercity">Cidade</label>
                <input type="text" name="usercity" id="usercity" placeholder="Fortaleza">
                
                </fieldset>

                <!-- habitos pessoais do usuario -->
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes sociais</p>
                    <input type="checkbox" name="usersocial" id="usersocial1" value="instagram">
                    <img src="./img/3.png" alt="Instagramlogo" class="logo-social">
                    <label for="usersocial1">Instagram</label>
                    <br>
                    <input type="checkbox" name="usersocial" id="usersocial2" value="facebook">
                    <img src="./img/1.png" alt="facebooklogo" class="logo-social">
                    <label for="usersocial2">Facebook</label>
                    <br>
                    <input type="checkbox" name="usersocial" id="usersocial3" value="tiktok">
                    <img src="./img/2.png" alt="tiktoklogo" class="logo-social">
                    <label for="usersocial3">Tiktok</label>
                <br>
                 <!-- estilo musical -->
                    <label for="usermusicstyle">Estilo Músical</label>
                    <input type="text" name="usermusicstyle" id="usermusicstyle" list="usermusicstyles">
                    <datalist id="usermusicstyles">
                        <option value="Rock"></option>
                        <option value="Pop"></option>
                        <option value="Sertanejo"></option>
                        <option value="Funk"></option>
                        <option value="Pagode"></option>
                        <option value="Forró"></option>



                    </datalist>
                     <!--cor favorita-->
                    <label for="userfavoritecolor">Cor favorita</label>
                    <input type="color" name="userfavoritecolor">
                

                </fieldset>

                <!--fieldset satisfacao-->
            
                <fieldset>
                    <legend>Satisfação</legend>
                    
                </fieldset>
                
                <button type="submit">Enviar</button>
            </form>
            
        </section>
        
        for
    </main>
</body>
</html>
